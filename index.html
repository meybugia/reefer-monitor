<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reefer Fleet Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .header h1 { font-size: 16px; color: #58a6ff; font-weight: 600; }
    .header-meta { display: flex; gap: 16px; align-items: center; color: #8b949e; font-size: 12px; }
    .countdown-badge { background: #21262d; border: 1px solid #30363d; padding: 3px 10px; border-radius: 12px; }
    .table-wrapper { flex: 1; overflow: auto; padding: 12px 16px; }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    thead { position: sticky; top: 0; z-index: 10; }
    th { background: #161b22; color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; padding: 9px 10px; text-align: left; border-bottom: 2px solid #30363d; white-space: nowrap; }
    td { padding: 8px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; white-space: nowrap; }
    tr:hover td { background: #161b22; }
    .reg-num { font-weight: 700; color: #e6edf3; }
    .address { color: #8b949e; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .ign-on { color: #3fb950; font-weight: 700; }
    .ign-off { color: #484f58; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .badge-moving  { background: #1a4d1a; color: #3fb950; border: 1px solid #2ea043; }
    .badge-idling  { background: #4d3800; color: #e3b341; border: 1px solid #9e6a03; }
    .badge-stopped { background: #4d1a1a; color: #f78166; border: 1px solid #da3633; }
    .badge-parking { background: #21262d; color: #8b949e; border: 1px solid #30363d; }
    .duration { color: #8b949e; font-size: 12px; }
    .temp-cell { display: flex; align-items: center; gap: 5px; }
    .temp-bound { color: #484f58; font-size: 11px; min-width: 34px; }
    .temp-current { font-weight: 700; font-size: 13px; padding: 2px 7px; border-radius: 4px; min-width: 54px; text-align: center; }
    .temp-ok    { color: #3fb950; background: #1a3a1f; }
    .temp-alert { color: #ffffff; background: #da3633; }
    .temp-only  { color: #c9d1d9; }
    .door-open   { color: #f78166; font-weight: 700; }
    .door-closed { color: #3fb950; }
    .state-msg { padding: 40px; text-align: center; color: #8b949e; font-size: 14px; }
    .state-error { color: #f78166; }
  </style>
</head>
<body>
<div class="header">
  <h1>Reefer Fleet Monitor</h1>
  <div class="header-meta">
    <span><span id="vehicleCount">-</span> vehicles</span>
    <span class="countdown-badge">Refresh in <strong id="countdown">30</strong>s</span>
    <span id="lastUpdated">-</span>
  </div>
</div>
<div class="table-wrapper" id="tableWrapper">
  <div class="state-msg">Initialising fleet data...</div>
</div>
<script>
(function () {
  var REFRESH_INTERVAL  = 30;
  var SENSOR_LOOKBACK   = 5;
  var PARKING_THRESHOLD = 3600;
  var _api;
  var _diagMap   = { temp1: null, temp2: null, temp3: null, door1: null, door2: null };
  var _threshMap = {};
  var _timer;
  var _tick = REFRESH_INTERVAL;

  function apiCall(method, params) {
    return new Promise(function (resolve, reject) { _api.call(method, params, resolve, reject); });
  }

  async function discoverDiagnostics() {
    var all = await apiCall("Get", { typeName: "Diagnostic", resultsLimit: 5000 });
    all.forEach(function (d) {
      if (!d.name) return;
      var n = d.name.toLowerCase();
      var isColdRelated = n.includes("cold") || n.includes("ioxcold") || n.includes("iox-cold");
      var isTemp = n.includes("temp");
      var isDoor = n.includes("door") || n.includes("cargo");
      if (isColdRelated && isTemp) {
        if      (n.includes("1") && !_diagMap.temp1) _diagMap.temp1 = d.id;
        else if (n.includes("2") && !_diagMap.temp2) _diagMap.temp2 = d.id;
        else if (n.includes("3") && !_diagMap.temp3) _diagMap.temp3 = d.id;
      }
      if (isColdRelated && isDoor) {
        if      (n.includes("1") && !_diagMap.door1) _diagMap.door1 = d.id;
        else if (n.includes("2") && !_diagMap.door2) _diagMap.door2 = d.id;
      }
    });
  }

  async function loadThresholds() {
    var rules = await apiCall("Get", { typeName: "Rule", resultsLimit: 1000 });
    var tempIds = new Set([_diagMap.temp1, _diagMap.temp2, _diagMap.temp3].filter(Boolean));
    rules.forEach(function (rule) { if (rule.condition) traverseCondition(rule.condition, tempIds); });
  }

  function traverseCondition(cond, tempIds) {
    if (!cond) return;
    var diagId = cond.diagnostic && cond.diagnostic.id;
    if (diagId && tempIds.has(diagId)) {
      if (!_threshMap[diagId]) _threshMap[diagId] = { min: null, cap: null };
      if (cond.minimum != null) _threshMap[diagId].min = cond.minimum;
      if (cond.maximum != null) _threshMap[diagId].cap = cond.maximum;
      if (cond.value != null) {
        if (cond.conditionType === "IsValueLessThan" || cond.conditionType === "IsValueLessOrEqual") _threshMap[diagId].min = cond.value;
        if (cond.conditionType === "IsValueMoreThan" || cond.conditionType === "IsValueMoreOrEqual") _threshMap[diagId].cap = cond.value;
      }
    }
    if (Array.isArray(cond.conditions)) { cond.conditions.forEach(function (c) { traverseCondition(c, tempIds); }); }
  }

  async function fetchFleetData() {
    var fromDate = new Date(Date.now() - SENSOR_LOOKBACK * 60 * 1000).toISOString();
    var base = await Promise.all([
      apiCall("Get", { typeName: "Device",           resultsLimit: 1000 }),
      apiCall("Get", { typeName: "DeviceStatusInfo", resultsLimit: 1000 }),
      apiCall("Get", { typeName: "Zone",             resultsLimit: 2000 })
    ]);
    var deviceMap = byId(base[0]); var statuses = base[1]; var zoneMap = byId(base[2]);
    var slots = ["temp1","temp2","temp3","door1","door2"];
    var diagIds = slots.map(function (k) { return _diagMap[k]; });
    var fetches = diagIds.map(function (id) {
      if (!id) return Promise.resolve([]);
      return apiCall("Get", { typeName: "StatusData", search: { diagnosticSearch: { id: id }, fromDate: fromDate }, resultsLimit: 2000 });
    });
    fetches.push(apiCall("Get", { typeName: "StatusData", search: { diagnosticSearch: { id: "DiagnosticIgnitionId" }, fromDate: fromDate }, resultsLimit: 2000 }));
    var results = await Promise.all(fetches);
    var ignData = results.pop();
    var sensorMap = buildSensorMap(results, diagIds);
    var ignMap = buildLatestMap(ignData);
    var coordList = statuses.filter(function (s) { return s.latitude && s.longitude; });
    var addresses = [];
    if (coordList.length > 0) {
      try { addresses = await apiCall("GetAddresses", { coordinates: coordList.map(function (s) { return { x: s.longitude, y: s.latitude }; }) }); } catch (e) {}
    }
    var addrMap = {};
    coordList.forEach(function (s, i) { addrMap[s.device.id] = (addresses[i] && addresses[i].formattedAddress) || "-"; });
    statuses.forEach(function (s) {
      if (s.currentZones && s.currentZones.length) { var z = zoneMap[s.currentZones[0].id]; if (z) addrMap[s.device.id] = "[Zone] " + z.name; }
    });
    return statuses.map(function (s) {
      var device = deviceMap[s.device.id]; if (!device) return null;
      var speed = s.speed || 0; var sensors = sensorMap[s.device.id] || {};
      var ignEntry = ignMap[s.device.id]; var ignOn = ignEntry ? (ignEntry.data === 1) : (speed > 0);
      var dur = s.currentStateDuration || 0;
      var status;
      if      (ignOn  && speed > 5)               status = "Moving";
      else if (ignOn  && speed <= 5)              status = "Idling";
      else if (!ignOn && dur < PARKING_THRESHOLD) status = "Stopped";
      else                                         status = "Parking";
      return { regNum: device.licensePlate || device.name || "-", address: addrMap[s.device.id] || "-",
        ignOn: ignOn, speed: Math.round(speed), status: status, duration: dur,
        temp1: readVal(sensors, _diagMap.temp1), temp2: readVal(sensors, _diagMap.temp2), temp3: readVal(sensors, _diagMap.temp3),
        door1: readDoor(sensors, _diagMap.door1), door2: readDoor(sensors, _diagMap.door2) };
    }).filter(Boolean);
  }

  function buildSensorMap(arrays, ids) {
    var map = {};
    arrays.forEach(function (arr, i) {
      var id = ids[i]; if (!id) return;
      arr.forEach(function (sd) { var dId = sd.device.id; if (!map[dId]) map[dId] = {}; if (!map[dId][id] || sd.dateTime > map[dId][id].dateTime) map[dId][id] = sd; });
    });
    return map;
  }
  function buildLatestMap(arr) { var map = {}; arr.forEach(function (sd) { var id = sd.device.id; if (!map[id] || sd.dateTime > map[id].dateTime) map[id] = sd; }); return map; }
  function readVal(sensors, id)  { return (id && sensors[id]) ? sensors[id].data : null; }
  function readDoor(sensors, id) { if (!id || !sensors[id]) return null; return sensors[id].data === 1 ? "Open" : "Closed"; }

  function render(rows) {
    var wrap = document.getElementById("tableWrapper");
    if (!rows.length) { wrap.innerHTML = "<div class='state-msg state-error'>No vehicles found.</div>"; return; }
    document.getElementById("vehicleCount").textContent = rows.length;
    document.getElementById("lastUpdated").textContent = "Updated " + new Date().toLocaleTimeString();
    wrap.innerHTML = "<table><thead><tr><th>Reg Num</th><th>Address / Zone</th><th>IGN</th><th>Speed</th><th>Status</th><th>Duration</th><th>Temp 1</th><th>Temp 2</th><th>Temp 3</th><th>Door 1</th><th>Door 2</th></tr></thead><tbody>" + rows.map(renderRow).join("") + "</tbody></table>";
  }

  function renderRow(r) {
    return "<tr><td class='reg-num'>" + x(r.regNum) + "</td><td class='address' title='" + x(r.address) + "'>" + x(r.address) + "</td>" +
      "<td class='" + (r.ignOn ? "ign-on" : "ign-off") + "'>" + (r.ignOn ? "ON" : "OFF") + "</td>" +
      "<td>" + r.speed + " km/h</td><td>" + badge(r.status) + "</td><td class='duration'>" + fmt(r.duration) + "</td>" +
      "<td>" + renderTemp(r.temp1, _diagMap.temp1) + "</td><td>" + renderTemp(r.temp2, _diagMap.temp2) + "</td><td>" + renderTemp(r.temp3, _diagMap.temp3) + "</td>" +
      "<td>" + renderDoor(r.door1) + "</td><td>" + renderDoor(r.door2) + "</td></tr>";
  }

  function badge(s) {
    var cls = { Moving:"badge-moving", Idling:"badge-idling", Stopped:"badge-stopped", Parking:"badge-parking" };
    return "<span class='badge " + (cls[s] || "") + "'>" + s + "</span>";
  }

  function renderTemp(val, diagId) {
    if (val === null || val === undefined) return "<span style='color:#484f58'>-</span>";
    var t = _threshMap[diagId]; var hasMin = t && t.min !== null; var hasCap = t && t.cap !== null;
    if (!hasMin && !hasCap) return "<span class='temp-current temp-only'>" + val.toFixed(1) + "C</span>";
    var inRange = (!hasMin || val >= t.min) && (!hasCap || val <= t.cap);
    return "<div class='temp-cell'>" + (hasMin ? "<span class='temp-bound'>" + t.min + "</span>" : "") +
      "<span class='temp-current " + (inRange ? "temp-ok" : "temp-alert") + "'>" + val.toFixed(1) + "C</span>" +
      (hasCap ? "<span class='temp-bound'>" + t.cap + "</span>" : "") + "</div>";
  }

  function renderDoor(val) {
    if (val === null || val === undefined) return "<span style='color:#484f58'>-</span>";
    return val === "Open" ? "<span class='door-open'>Open</span>" : "<span class='door-closed'>Closed</span>";
  }

  function byId(arr) { return arr.reduce(function (m, o) { m[o.id] = o; return m; }, {}); }
  function x(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function fmt(sec) {
    if (!sec) return "-";
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if (h > 0) return h + "h " + m + "m"; if (m > 0) return m + "m " + s + "s"; return s + "s";
  }

  async function refresh() {
    try { render(await fetchFleetData()); }
    catch (e) { document.getElementById("tableWrapper").innerHTML = "<div class='state-msg state-error'>Error: " + (e.message || JSON.stringify(e)) + "</div>"; }
  }

  function startCountdown() {
    clearInterval(_timer); _tick = REFRESH_INTERVAL;
    _timer = setInterval(function () {
      _tick--; var el = document.getElementById("countdown"); if (el) el.textContent = _tick;
      if (_tick <= 0) { _tick = REFRESH_INTERVAL; refresh(); }
    }, 1000);
  }

  geotab.addin.reeferMonitor = function (api, state) {
    return {
      initialize: async function (freshApi, freshState, callback) {
        _api = freshApi;
        try { await discoverDiagnostics(); await loadThresholds(); await refresh(); startCountdown(); }
        catch (e) { document.getElementById("tableWrapper").innerHTML = "<div class='state-msg state-error'>Init failed: " + (e.message || JSON.stringify(e)) + "</div>"; }
        callback();
      },
      focus: function (freshApi) { _api = freshApi; },
      blur:  function ()         { clearInterval(_timer); }
    };
  };
})();
</script>
</body>
</html>
